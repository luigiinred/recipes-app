name: Recipes
options:
  bundleIdPrefix: com.garrabrant
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  RecipeKit:
    path: .
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.4
settings:
  base:
    DEVELOPMENT_TEAM: A2VG7FKNF9
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Recipes:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: RecipeKit
        product: RecipeKit
      - target: ShareExtension
    scheme:
      testTargets: [RecipesTests, RecipesUITests]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Recipes
        NSRemindersFullAccessUsageDescription: Recipes keeps your grocery list in sync with a list in the Reminders app.
        NSRemindersUsageDescription: Recipes keeps your grocery list in sync with a list in the Reminders app.
        NSCameraUsageDescription: Recipes uses the camera to scan recipes from books and printouts.
        CFBundleIconName: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.garrabrant.recipes
            CFBundleURLSchemes: [recipes]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        LSApplicationCategoryType: public.app-category.food-and-drink
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUbiquitousContainers:
          iCloud.com.garrabrant.recipes:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Recipes
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garrabrant.recipes
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Recipes-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: App/Recipes-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  ShareExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - ShareExtension
      - App/ImportProgressView.swift
      - App/RecipeEditorView.swift
      - App/TagEditor.swift
      - App/ChipFlow.swift
      - App/RecipeActions.swift
      - App/RecipeLibrary.swift
      - App/RemindersSync.swift
      - App/RecipeImageGenerator.swift
      - App/RecipeImageView.swift
      - App/StepImageView.swift
      - App/ToolbarButtons.swift
      - App/AppSettings.swift
      - App/Theme.swift
      - App/RecipeLink.swift
      - App/PlannerDrag.swift
    dependencies:
      - package: RecipeKit
        product: RecipeKit
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Recipes
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garrabrant.recipes.share
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHARE_EXTENSION"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Recipes-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: App/Recipes-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  RecipesTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: RecipesTests
        excludes: ["__Snapshots__/**"]
    dependencies:
      - target: Recipes
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.garrabrant.recipes.tests
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Recipes.app/Contents/MacOS/Recipes
        BUNDLE_LOADER[sdk=macosx*]: $(TEST_HOST)
  RecipesUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS, iOS]
    sources: [RecipesUITests]
    dependencies:
      - target: Recipes
      - package: RecipeKit
        product: RecipeKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.garrabrant.recipes.uitests
        TEST_TARGET_NAME: Recipes
