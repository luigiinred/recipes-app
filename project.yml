name: Recipes
options:
  bundleIdPrefix: com.garrabrant
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  RecipeKit:
    path: .
settings:
  base:
    DEVELOPMENT_TEAM: A2VG7FKNF9
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Recipes:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: RecipeKit
        product: RecipeKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Recipes
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUbiquitousContainers:
          iCloud.com.garrabrant.recipes:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Recipes
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garrabrant.recipes
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Recipes-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: App/Recipes-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
