name: Recipes
options:
  bundleIdPrefix: com.garrabrant
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  RecipeKit:
    path: .
settings:
  base:
    DEVELOPMENT_TEAM: A2VG7FKNF9
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Recipes:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: RecipeKit
        product: RecipeKit
      - target: ShareExtension
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Recipes
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        LSApplicationCategoryType: public.app-category.food-and-drink
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUbiquitousContainers:
          iCloud.com.garrabrant.recipes:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Recipes
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garrabrant.recipes
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Recipes-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: App/Recipes-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  ShareExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources: [ShareExtension]
    dependencies:
      - package: RecipeKit
        product: RecipeKit
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Recipes
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garrabrant.recipes.share
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Recipes-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: App/Recipes-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
