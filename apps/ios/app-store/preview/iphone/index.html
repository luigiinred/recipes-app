<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenRecipes — iphone app preview</title>
<style>
  @font-face { font-family: "NY"; src: url("file:///System/Library/Fonts/NewYork.ttf"); font-weight: 100 900; }
  :root { --paper:#FFF1E0; --ink:#2B2320; --accent:#E8672A; --dark:#2B2320; --cream:#FFF1E0; --accent-dark:#FF8A4C; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:886px; height:1920px; overflow:hidden; background:var(--paper); }
  #root { position:relative; width:886px; height:1920px; overflow:hidden; background:var(--paper); }
  .viewport { position:absolute; inset:0; perspective:2400px; perspective-origin:50% 50%; pointer-events:none; }
  .world { position:absolute; left:443.0px; top:960.0px; width:0; height:0; transform-style:preserve-3d; }
  .screen { position:absolute; left:0; top:0; will-change:transform; }
  .screen .glass { position:absolute; inset:0; overflow:hidden; background:#fff; }
  .screen .glass img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .screen .bezel { position:absolute; display:block; pointer-events:none; }
  .screen .shadow { position:absolute; left:4%; right:4%; top:5%; bottom:-1%; background:rgba(60,28,10,.34); filter:blur(34px); }
  svg.thread { position:absolute; left:0; top:0; overflow:visible; }
  svg.thread path { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  #hud { position:absolute; inset:0; pointer-events:none; }
  .cap { position:absolute; left:0; right:0; top:128px; text-align:center; font-family:"NY","New York",Georgia,serif; font-weight:600;
         font-size:70px; line-height:1.12; letter-spacing:-.012em; color:var(--ink); }
  .cap .ln { display:block; overflow:hidden; padding:4px 0 10px; margin:-4px 0 -10px; }
  .cap .ln > span { display:inline-block; will-change:transform; }
  .cap em { font-style:normal; color:var(--accent); }
  .cap.dark { color:var(--cream); } .cap.dark em { color:var(--accent-dark); }
  #band { position:absolute; left:0; right:0; top:0; height:358px; background:var(--paper); }
  #dark { position:absolute; inset:0; background:var(--dark); clip-path:circle(0px at 50% 50%); }
  #glow { position:absolute; inset:0; background:radial-gradient(circle at 50% 45%, rgba(255,138,76,.28), rgba(255,138,76,0) 62%); opacity:0; }
  .close-icon { position:absolute; left:0; top:0; will-change:transform; filter:drop-shadow(0 26px 39.0px rgba(0,0,0,.45)); perspective:900px; }
  .ic-tile { position:absolute; left:0; top:0; }
  .ic-bg { position:absolute; inset:0; border-radius:22.37%; background:linear-gradient(180deg,#FFD5A8,#BF5C40); }
  .ic-book { position:absolute; display:flex; transform-style:preserve-3d; }
  .ic-page { width:50%; height:100%; will-change:transform; backface-visibility:hidden;
             background:linear-gradient(180deg,#FBE9D6,#DDB596); -webkit-mask-image:url(../assets/icon/book.png); -webkit-mask-size:200% 100%; }
  .ic-page.l { -webkit-mask-position:left top; transform-origin:100% 50%; }
  .ic-page.r { -webkit-mask-position:right top; transform-origin:0% 50%; }
  .ic-fork, .ic-spoon { position:absolute; will-change:transform; background:linear-gradient(180deg,#FF9B3E,#B9692D); -webkit-mask-size:100% 100%; }
  .ic-fork { -webkit-mask-image:url(../assets/icon/fork.png); }
  .ic-spoon { -webkit-mask-image:url(../assets/icon/spoon.png); }
  .ic-real { position:absolute; left:0; top:0; opacity:0; }
  .close-word { position:absolute; left:0; top:0; white-space:nowrap; font-family:"NY","New York",Georgia,serif; font-weight:600; letter-spacing:-.02em; color:var(--cream); line-height:1; font-size:112px; will-change:transform; }
  .close-ghost { position:absolute; left:0; top:0; will-change:transform; filter:blur(4px) brightness(.62) saturate(.85); opacity:0; }
  .close-ghost .gimg { border-radius:84px; }
</style>
</head>
<body>
<div id="root" data-composition-id="openrecipes-iphone" data-start="0" data-duration="26.4" data-width="886" data-height="1920" data-fps="30">
  <div class="viewport"><div class="world" id="world"></div></div>
  <div id="band"></div>
  <div id="dark"></div>
  <div id="glow"></div>
  <div class="viewport"><div class="world" id="world2"></div></div>
  <div id="hud"></div>
</div>
<script>window.DEVICE = "iphone";</script>
<script src="../events.js"></script>
<script src="../shared/kit.js"></script>
<script src="../shared/engine.js"></script>
</body>
</html>
