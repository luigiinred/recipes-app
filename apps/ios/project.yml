name: Recipes
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  RecipeKit:
    path: .
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.4
settings:
  base:
    DEVELOPMENT_TEAM: ${RECIPES_TEAM_ID}
    RECIPES_ICLOUD_CONTAINER: ${RECIPES_ICLOUD_CONTAINER}
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "12"
targets:
  Recipes:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: RecipeKit
        product: RecipeKit
      - target: ShareExtension
      - target: TimerWidget
        platformFilter: iOS
    scheme:
      testTargets: [RecipesTests, RecipesUITests]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Recipes
        NSRemindersFullAccessUsageDescription: Recipes keeps your grocery list in sync with a list in the Reminders app.
        NSRemindersUsageDescription: Recipes keeps your grocery list in sync with a list in the Reminders app.
        NSCameraUsageDescription: Recipes uses the camera to scan recipes from books and printouts.
        CFBundleIconName: AppIcon
        RecipesICloudContainer: "$(RECIPES_ICLOUD_CONTAINER)"
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [recipes]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Recipes connects to your Mealie server on your home network to sync recipes.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        LSApplicationCategoryType: public.app-category.food-and-drink
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUbiquitousContainers:
          ${RECIPES_ICLOUD_CONTAINER}:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Recipes
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${RECIPES_BUNDLE_ID}
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Recipes-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: App/Recipes-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  ShareExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - ShareExtension
      - App/ImportProgressView.swift
      - App/RecipeEditorView.swift
      - App/TagEditor.swift
      - App/ChipFlow.swift
      - App/RecipeActions.swift
      - App/RecipeLibrary.swift
      - App/RemindersSync.swift
      - App/RecipeImageGenerator.swift
      - App/RecipeImageView.swift
      - App/StepImageView.swift
      - App/ToolbarButtons.swift
      - App/AppSettings.swift
      - App/Theme.swift
      - App/RecipeLink.swift
      - App/Mascot.swift
      - App/MascotStyle.swift
      - App/Assets.xcassets
    dependencies:
      - package: RecipeKit
        product: RecipeKit
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Recipes
        RecipesICloudContainer: "$(RECIPES_ICLOUD_CONTAINER)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${RECIPES_BUNDLE_ID}.share
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SHARE_EXTENSION"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Recipes-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: App/Recipes-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  TimerWidget:
    type: app-extension
    supportedDestinations: [iOS]
    sources:
      - TimerWidget
      - App/LiveActivity/TimerActivityAttributes.swift
    info:
      path: TimerWidget/Info.plist
      properties:
        CFBundleDisplayName: Recipe Timers
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${RECIPES_BUNDLE_ID}.timers
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  RecipesTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: RecipesTests
        excludes: ["__Snapshots__/**"]
    dependencies:
      - target: Recipes
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ${RECIPES_BUNDLE_ID}.tests
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Recipes.app/Contents/MacOS/Recipes
        BUNDLE_LOADER[sdk=macosx*]: $(TEST_HOST)
  RecipesUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS, iOS]
    sources: [RecipesUITests]
    dependencies:
      - target: Recipes
      - package: RecipeKit
        product: RecipeKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ${RECIPES_BUNDLE_ID}.uitests
        TEST_TARGET_NAME: Recipes
